<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060814"/>
      <stop offset="55%" stop-color="#0A0E1F"/>
      <stop offset="100%" stop-color="#0D0A1C"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8FB4FF"/>
      <stop offset="50%" stop-color="#C6A8FF"/>
      <stop offset="100%" stop-color="#7FE7F5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1000" height="260" rx="20" fill="url(#bg)"/>
  <circle cx="150" cy="60" r="180" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="860" cy="210" r="180" fill="url(#glow)" filter="url(#soft)"/>

  <!-- fine grid -->
  <g opacity="0.05" stroke="#7FE7F5">
    <path d="M0 40 H1000"/>
    <path d="M0 90 H1000"/>
    <path d="M0 140 H1000"/>
    <path d="M0 190 H1000"/>
    <path d="M0 220 H1000"/>
  </g>

  <!-- animated wave line -->
  <path d="M0 232 C 150 210, 300 250, 450 220 C 600 190, 750 236, 1000 208"
        fill="none" stroke="url(#stroke)" stroke-width="1.4" opacity="0.55" stroke-linecap="round"
        stroke-dasharray="6 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- eyebrow -->
  <text x="60" y="66" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" letter-spacing="4" fill="#5EEAD4" opacity="0.85">HARSHAL PATIL // SYSTEM.INIT</text>

  <!-- name, typing reveal -->
  <g>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="140" y2="0">
        <animate attributeName="width" from="0" to="640" dur="1.6s" fill="freeze" begin="0.2s" calcMode="spline" keySplines="0.2 0 0.1 1"/>
      </rect>
    </clipPath>
    <text x="58" y="128" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="url(#text-grad)" clip-path="url(#reveal)">Harshal Patil</text>
  </g>

  <!-- cursor -->
  <rect x="60" y="90" width="3" height="46" fill="#7FE7F5">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="x" from="60" to="700" dur="1.6s" begin="0.2s" fill="freeze"/>
  </rect>

  <!-- cycling roles -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="20" fill="#B9C2DA">
    <text x="60" y="168" opacity="0">Full&#8209;Stack Developer
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.22;0.27" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="168" opacity="0">AI Architect
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.30;0.47;0.52" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="168" opacity="0">Cloud Engineer
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.50;0.55;0.72;0.77" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="168" opacity="0">SaaS Builder
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.80;0.97;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="60" y="205" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#6B7490" letter-spacing="0.5">Building production-grade software, from cloud infra to AI agents.</text>

  <!-- right-side status card -->
  <g transform="translate(770,44)">
    <rect width="170" height="94" rx="12" fill="#0F1424" stroke="url(#stroke)" stroke-opacity="0.4"/>
    <circle cx="20" cy="22" r="4" fill="#22D3EE">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="27" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8FE3EA">status: shipping</text>
    <text x="20" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8890A8">location: India</text>
    <text x="20" y="72" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8890A8">stack: full&#8209;cycle</text>
  </g>
</svg>
